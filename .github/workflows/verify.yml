name: Verify snippets

# Proves every Kotlin block in the skill compiles against the pinned material3 version
# and that the markdown matches the compiled code.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Markdown matches compiled snippets
        run: python3 scripts/sync_snippets.py --check
      - name: Compile snippets
        working-directory: verify
        run: ./gradlew :snippets:assembleDebug --stacktrace

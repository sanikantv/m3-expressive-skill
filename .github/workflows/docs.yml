# Builds expressive.sanikant.dev on every push to main: compiles every snippet, regenerates the
# shape data and reference pages from the skill, builds and checks the site.
# Deploys to Cloudflare Workers only when the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets exist (see site/DEPLOY.md). Without them the job still verifies the site builds.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets can't be read in a step-level `if:`, so expose them as job env first.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile snippets, regenerate data and pages, build site
        run: npm run build:all

      - name: Generated pages are committed
        run: git diff --exit-code -- src/content/docs/reference src/data src/styles/springs.css

      - name: Check SEO, links and structure
        run: npm run check

      - name: Deploy to Cloudflare Workers
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
